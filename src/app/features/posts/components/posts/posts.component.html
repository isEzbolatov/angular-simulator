<p-table [value]="posts">
  <ng-template pTemplate="header">
    <tr>
      <th>Title</th>
      <th>Tags</th>
      <th>Views</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-post>
    <tr>
      <td>{{ post.title }}</td>
      <td>{{ post.tags.join(', ') }}</td>
      <td>{{ post.views }}</td>
    </tr>
  </ng-template>
</p-table>

<p-paginator [first]="first" [rows]="rows" [totalRecords]="totalRecords" (onPageChange)="onPageChange($event)">
</p-paginator>
