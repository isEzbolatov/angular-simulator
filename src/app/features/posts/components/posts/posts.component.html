@if(!isLoading) {
  <p-table [value]="posts" [contextMenu]="cm" [(contextMenuSelection)]="selectedPost">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Tags</th>
        <th>Views</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-post>
      <tr [pContextMenuRow]="post">
        <td>{{ post.title }}</td>
        <td>{{ post.tags.join(', ') }}</td>
        <td>{{ post.views }}</td>
      </tr>
    </ng-template>
  </p-table>

  <p-contextmenu #cm [model]="menuItems"></p-contextmenu>
} @else {
  <p-skeleton></p-skeleton>
}

<p-paginator [first]="first" [rows]="rows" [totalRecords]="totalRecords" (onPageChange)="onPageChange($event)" [rowsPerPageOptions]="[10, 20, 50]">
</p-paginator>
