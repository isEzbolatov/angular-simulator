<section class="user-cards-container">
    <h1 class="users-title">Список Пользователей</h1>
    <div class="user-cards-wrapper">
        @for(user of users$ | async; track user.id) {
        <app-user-card></app-user-card>
        } @empty {
        <div class="not-found-users">
            <p class="not-found-users-title fs-26 fw-800">Нет пользователей для отображения</p>
        </div>
        }
    </div>
</section>
